# Spite et al. 2012, A&A 541, A143 -- non-LTE calcium on MARCS models.
#
# CDS J/A+A/541/A143: five fixed-width tables, one per [Fe/H] (0, -1, -2, -3,
# -3.5), concatenated here.  Ca I and Ca II lines share the files and are split
# on the "Ion" column ("Ca I" / "Ca II").
#
# [Ca/Fe] follows [Fe/H] rather than being a free axis: 0 at [Fe/H] = 0 and -1,
# +0.3 at -2 and below.  At -2 the paper also gives [Ca/Fe] = 0 for 6 of its 18
# models, as a sensitivity test; those rows are dropped and the grid is read as
# abundance-independent.  The test rows show what that costs: on the 235 nodes
# both cover, Delta(+0.3) - Delta(0) = -0.03 +- 0.035 dex (|diff| > 0.05 for 22%).
# Kept as an axis instead, [Ca/Fe] would be defined only at the metallicities
# where both values exist, and every query above [Fe/H] = -1 with [Ca/Fe] > 0
# would fall on masked nodes.

id         = "spite2012_ca"
format     = "tabular"
reference  = "Spite et al. 2012, A&A 541, A143"
element    = "Ca"
files      = ["tablea1.dat", "tablea2.dat", "tablea3.dat", "tablea4.dat", "tablea5.dat"]
kind       = "delta"
flavor     = "1D NLTE - 1D LTE"
ion_column = "Ion"
notes      = "No microturbulence axis. [Ca/Fe] = 0 at [Fe/H] >= -1 and +0.3 below, as in the paper; Delta does not vary with the query abundance (the paper's own test: ~0.03 dex per 0.3 dex in [Ca/Fe])."

[read]
format = "cds"
readme = "ReadMe"
where  = "not (`[Fe/H]` == '-2.' and `[Ca/Fe]` == '0.')"

[columns]
line  = "lambda"
teff  = "T"
logg  = "logg"
feh   = "[Fe/H]"
value = "Corr"

[abundance]
independent = true

[wavelengths]
unit = "angstrom"
