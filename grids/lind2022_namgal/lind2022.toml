# Lind, Nordlander, Wehrhahn et al. 2022, A&A 665, A33 -- 1D LTE and non-LTE
# curves of growth for Na, Mg and Al on MARCS models, UV to 3 micron.
#
# CDS J/A+A/665/A33 (corrected version of 2026-07-03): log10 of the LTE and
# non-LTE equivalent widths per line and model, one row per line.  Corrections
# are derived by equivalent-width matching, as the authors do.  Grid: Teff
# 3800-8000, log g 0-5.5, [Fe/H] -5 to +0.5, vmic 1 and 2 km/s, [X/Fe] in steps
# of 0.25.  The [X/Fe] column is printed with one decimal (-0.75 reads -0.8), so
# [snap] puts it back on the 0.25 grid.  Solar scale: Grevesse et al. 2007, as in
# the paper (Na 6.17, Mg 7.53, Al 6.37).
#
# Line identifiers are rounded air wavelengths; the aliases give the exact air
# wavelengths from the paper's line tables (arXiv:2206.11070).  Where two lines
# round to the same integer the file shifts one identifier by 1; those were
# resolved from the data: Mg 6318/6319/6320 are 6318.717/6319.237/6319.493 (file
# order), Mg 7877 is Mg II 7877.054 and 7878 is Mg I 7877.48 (7877 strengthens
# with Teff like Mg II 4481, 7878 weakens like Mg I), Al 6905/6906 and 7361/7362
# follow wavelength order.  Na 29892 is missing from the paper's table and keeps
# its rounded label.  The Mg and Al files also hold Mg II and Al II lines, split
# off by line identifier.

format    = "tabular"
reference = "Lind et al. 2022, A&A 665, A33"
kind      = "ew_pair"
flavor    = "1D NLTE - 1D LTE"
clip_axes = ["vmic"]
cache     = true

[snap]
abund = 0.25


[[tables]]
id      = "lind2022_na1"
element = "Na"
ion     = 1
file    = "na.dat.gz"
read    = { format = "cds", readme = "ReadMe" }
columns = { line = "Line", teff = "Teff", logg = "logg", feh = "[Fe/H]", vmic = "Vturb", abund = "[Na/Fe]", ew_lte = "logWL", ew_nlte = "logWN" }
abundance = { kind = "xfe", solar = 6.17 }
wavelengths = { unit = "angstrom", aliases = { "3302" = [3302.368], "4498" = [4497.657], "4669" = [4668.558], "4983" = [4982.811], "5149" = [5148.838], "5153" = [5153.402], "5683" = [5682.633], "5688" = [5688.199], "5890" = [5889.949], "5896" = [5895.922], "6154" = [6154.226], "6161" = [6160.747], "8183" = [8183.255], "8195" = [8194.807], "9466" = [9465.929], "9961" = [9961.272], "10746" = [10746.447], "10835" = [10834.865], "11381" = [11381.442], "11404" = [11403.768], "12311" = [12311.479], "12320" = [12319.97], "12679" = [12679.187], "14768" = [14767.539], "14780" = [14779.72], "16374" = [16373.87], "16389" = [16388.85], "18465" = [18465.42], "21452" = [21452.268], "22056" = [22056.393], "22084" = [22083.654], "23348" = [23348.377], "23379" = [23379.049], "25960" = [25959.867] } }

